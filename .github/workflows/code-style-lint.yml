name: Lint code style issues

on: # zizmor: ignore[concurrency-limits]
  pull_request:

permissions:
  contents: read
  pull-requests: read # required by tj-actions/changed-files when use_rest_api: true

jobs:
  lint-code-styling: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: true
          files: |
            **.php

      - name: Check PHP code style issues
        if: steps.changed-files.outputs.any_modified == 'true'
        uses: aglipanci/laravel-pint-action@36de00d5f5a8a4e12d443e01671daa12a18f4c79 # 2.6
        with:
          testMode: true
          verboseMode: true
          pintVersion: 1.29.0
