name: Lint code style issues

on: # zizmor: ignore[concurrency-limits]
  pull_request:

permissions:
  pull-requests: read # required by tj-actions/changed-files when use_rest_api: true

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          use_rest_api: true
          files: |
            **.php

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: steps.changed-files.outputs.any_modified == 'true'
        with:
          php-version: 8.5
          coverage: none
          tools: pint:1.29.0

      - name: Check PHP code style issues
        if: steps.changed-files.outputs.any_modified == 'true'
        run: pint --test -v

  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check code style issues
        run: npx --yes "prettier@$(node -p 'require("./package.json").devDependencies.prettier')" --check .
